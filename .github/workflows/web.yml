name: Build web PWA

on:
  push:
    branches:
      - main
    paths:
      - apps/web/**
      - packages/invite/**
      - packages/ui/**
      - fonts/**
      - package.json
      - bun.lock
      - .github/workflows/web.yml
  pull_request:
    paths:
      - apps/web/**
      - packages/invite/**
      - packages/ui/**
      - fonts/**
      - package.json
      - bun.lock
      - .github/workflows/web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.21

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile workspaces
        run: bun run compile

      - name: Test
        run: bun test

      - name: Build PWA
        env:
          VITE_CHROME_STORE_URL: ${{ vars.CHROME_STORE_URL }}
          VITE_FIREFOX_STORE_URL: ${{ vars.FIREFOX_STORE_URL }}
          VITE_ALLOW_LOCAL_INVITES: "false"
        run: bun run build:web

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsync-web-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 14
