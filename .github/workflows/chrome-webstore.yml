name: Publish Chrome Web Store

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      publish:
        description: Publish after upload
        required: true
        default: true
        type: boolean
      dry_run:
        description: Validate workflow without uploading or committing
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: chrome-webstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID || secrets.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID || secrets.CHROME_PUBLISHER_ID }}
      CHROME_PUBLISH: ${{ inputs.publish }}
      DRY_RUN: ${{ inputs.dry_run }}
      WXT_WS_SERVER: ${{ vars.DEFAULT_SYNC_SERVER }}
      WXT_PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID || secrets.WXT_FIREFOX_EXTENSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Restore immutable public config for tag retry
        if: ${{ inputs.bump == 'none' && github.ref_type == 'tag' }}
        run: bun scripts/release-public-config.ts export

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print release tool versions
        run: bun run tools:versions

      - name: Test
        run: bun test

      - name: Validate Chrome Web Store config
        shell: bash
        run: |
          missing=0

          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "${{ inputs.bump }}" == "none" ]]; then
              version="$(bun -e "console.log((await Bun.file('apps/extension/package.json').json()).version)")"
              if [[ "${{ github.ref_type }}" != "tag" || "${{ github.ref_name }}" != "v$version" ]]; then
                echo "A no-bump retry must run from immutable tag v$version." >&2
                missing=1
              else
                git fetch origin main
                if ! git merge-base --is-ancestor HEAD origin/main; then
                  echo "Retry tag must point to a commit contained in main." >&2
                  missing=1
                fi
              fi
            elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
              echo "Versioned production releases must be dispatched from main." >&2
              missing=1
            fi
          fi

          for name in \
            CHROME_EXTENSION_ID \
            CHROME_PUBLISHER_ID \
            WXT_WS_SERVER \
            WXT_PUBLIC_WEB_ORIGIN \
            WXT_FIREFOX_EXTENSION_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required. Add it as a repository variable or secret." >&2
              missing=1
            fi
          done

          if [[ -n "${WXT_WS_SERVER:-}" && -n "${WXT_PUBLIC_WEB_ORIGIN:-}" ]] && ! bun run validate:public-config; then
            missing=1
          fi

          if [[ "$DRY_RUN" != "true" && -z "${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}" ]]; then
            echo "CHROME_SERVICE_ACCOUNT_KEY is required. Add it as a repository secret." >&2
            missing=1
          fi

          exit "$missing"

      - name: Require latest sync-server image build
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          server_sha="$(git log -1 --format=%H -- \
            apps/sync-server \
            packages/sync-protocol \
            Dockerfile.sync-server \
            package.json \
            bun.lock)"
          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --workflow sync-server-image.yml \
              --branch main \
              --commit "$server_sha" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "No sync-server image build exists for relevant main commit $server_sha." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status

      - name: Bump extension version
        id: version
        shell: bash
        run: |
          if [[ "${{ inputs.dry_run }}" == "false" && "${{ inputs.bump }}" != "none" ]]; then
            bun scripts/release-public-config.ts write
          fi
          version="$(bun run version:extension -- "${{ inputs.bump }}")"
          bun install --lockfile-only

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: ${{ inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Compile
        run: bun run compile

      - name: Build Chrome extension zip
        working-directory: apps/extension
        run: bun run zip

      - name: Validate Chrome artifact
        id: artifacts
        run: bun run validate:artifact -- chrome

      - name: Save Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsync-${{ steps.version.outputs.version }}-chrome
          path: ${{ steps.artifacts.outputs.chrome_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Record release commit and immutable tag
        if: ${{ inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/package.json apps/extension/release-config.json bun.lock
          git commit -m "chore(extension): release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push --atomic origin \
            "HEAD:refs/heads/${{ github.ref_name }}" \
            "refs/tags/${{ steps.version.outputs.tag }}"

      - name: Authenticate to Google Cloud
        if: ${{ inputs.dry_run == false }}
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.CHROME_SERVICE_ACCOUNT_KEY }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore

      - name: Publish to Chrome Web Store
        if: ${{ inputs.dry_run == false }}
        env:
          CHROME_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          bun run publish:chrome -- "${{ steps.artifacts.outputs.chrome_zip }}"

      - name: Dispatch and await Firefox release
        if: ${{ inputs.dry_run == false && inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          previous_run="$(gh run list \
            --workflow firefox-addons.yml \
            --branch "${{ steps.version.outputs.tag }}" \
            --event workflow_dispatch \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // 0')"
          gh workflow run firefox-addons.yml \
            --ref "${{ steps.version.outputs.tag }}" \
            -f bump=none \
            -f channel=listed \
            -f dry_run=false

          run_id=""
          for _ in {1..30}; do
            run_id="$(gh run list \
              --workflow firefox-addons.yml \
              --branch "${{ steps.version.outputs.tag }}" \
              --event workflow_dispatch \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // empty')"
            if [[ -n "$run_id" && "$run_id" != "$previous_run" ]]; then break; fi
            sleep 2
          done
          if [[ -z "$run_id" || "$run_id" == "$previous_run" ]]; then
            echo "Firefox release run was not created." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
