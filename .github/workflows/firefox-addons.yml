name: Publish Firefox Add-on

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: none
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      channel:
        description: Firefox Add-ons channel
        required: true
        default: listed
        type: choice
        options:
          - listed
          - unlisted
      dry_run:
        description: Validate AMO credentials without uploading
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: firefox-addons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID || secrets.WXT_FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      FIREFOX_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'listed' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Firefox Add-ons config
        shell: bash
        run: |
          missing=0

          if [[ -z "${WXT_FIREFOX_EXTENSION_ID:-}" ]]; then
            echo "WXT_FIREFOX_EXTENSION_ID is required. Add it as a repository variable or secret." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_ISSUER:-}" ]]; then
            echo "FIREFOX_JWT_ISSUER is required. Add it as a repository secret." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_SECRET:-}" ]]; then
            echo "FIREFOX_JWT_SECRET is required. Add it as a repository secret." >&2
            missing=1
          fi

          exit "$missing"

      - name: Bump extension version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: version
        shell: bash
        run: |
          version="$(bun run version:extension -- "${{ inputs.bump }}")"
          bun install --lockfile-only

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Compile
        run: bun run compile

      - name: Build Firefox extension zip
        run: bun run zip:firefox

      - name: Publish to Firefox Add-ons
        shell: bash
        run: |
          firefox_zip="$(find apps/extension/.output -maxdepth 1 -name '*-firefox.zip' -print -quit)"
          sources_zip="$(find apps/extension/.output -maxdepth 1 -name '*-sources.zip' -print -quit)"

          if [[ -z "$firefox_zip" || -z "$sources_zip" ]]; then
            echo "Firefox extension zip or sources zip was not generated" >&2
            exit 1
          fi

          args=(
            --firefox-zip "$firefox_zip"
            --firefox-sources-zip "$sources_zip"
            --firefox-extension-id "$WXT_FIREFOX_EXTENSION_ID"
            --firefox-jwt-issuer "$FIREFOX_JWT_ISSUER"
            --firefox-jwt-secret "$FIREFOX_JWT_SECRET"
            --firefox-channel "$FIREFOX_CHANNEL"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          bunx wxt submit "${args[@]}"

      - name: Commit version bump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/package.json bun.lock
          git commit -m "chore(extension): release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} "${{ steps.version.outputs.tag }}"
