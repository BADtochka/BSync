name: Publish Firefox Add-on

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: none
        type: choice
        options:
          - none
      channel:
        description: Firefox Add-ons channel
        required: true
        default: listed
        type: choice
        options:
          - listed
          - unlisted
      dry_run:
        description: Validate AMO credentials without uploading
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: firefox-addons-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID || secrets.WXT_FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      FIREFOX_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'listed' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      WXT_WS_SERVER: ${{ vars.DEFAULT_SYNC_SERVER }}
      WXT_PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Restore immutable public config from release tag
        if: ${{ github.ref_type == 'tag' }}
        run: bun scripts/release-public-config.ts export

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print release tool versions
        run: bun run tools:versions

      - name: Test
        run: bun test

      - name: Validate Firefox Add-ons config
        shell: bash
        run: |
          missing=0

          for name in WXT_WS_SERVER WXT_PUBLIC_WEB_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name is required as a repository variable." >&2
              missing=1
            fi
          done

          if [[ -n "${WXT_WS_SERVER:-}" && -n "${WXT_PUBLIC_WEB_ORIGIN:-}" ]] && ! bun run validate:public-config; then
            missing=1
          fi

          if [[ -z "${WXT_FIREFOX_EXTENSION_ID:-}" ]]; then
            echo "WXT_FIREFOX_EXTENSION_ID is required. Add it as a repository variable or secret." >&2
            missing=1
          elif [[ ! "$WXT_FIREFOX_EXTENSION_ID" =~ ^\{[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}\}$ && ! "$WXT_FIREFOX_EXTENSION_ID" =~ ^[a-zA-Z0-9._-]+@[a-zA-Z0-9._-]+$ ]]; then
            echo "WXT_FIREFOX_EXTENSION_ID must be a {UUID} or an email-like Firefox ID." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_ISSUER:-}" ]]; then
            echo "FIREFOX_JWT_ISSUER is required. Add it as a repository secret." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_SECRET:-}" ]]; then
            echo "FIREFOX_JWT_SECRET is required. Add it as a repository secret." >&2
            missing=1
          fi

          exit "$missing"

      - name: Resolve extension version
        id: version
        shell: bash
        run: |
          version="$(bun -e "console.log((await Bun.file('apps/extension/package.json').json()).version)")"

          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "${{ github.ref_type }}" != "tag" || "${{ github.ref_name }}" != "v$version" ]]; then
              echo "Production publish must run from immutable tag v$version." >&2
              exit 1
            fi
            git fetch origin main
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tag must point to a commit contained in main." >&2
              exit 1
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Compile
        run: bun run compile

      - name: Build Firefox extension zip
        working-directory: apps/extension
        run: bun run zip:firefox

      - name: Validate Firefox artifacts
        id: artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bun run validate:artifact -- firefox

      - name: Smoke rebuild from Firefox source ZIP
        shell: bash
        run: |
          rebuild_root="$RUNNER_TEMP/bsync-source-rebuild"
          rm -rf "$rebuild_root"
          mkdir -p "$rebuild_root"
          unzip -q "${{ steps.artifacts.outputs.sources_zip }}" -d "$rebuild_root"
          pushd "$rebuild_root"
          bun install --frozen-lockfile
          bun run --cwd packages/sync-protocol compile
          bun run --cwd packages/invite compile
          bun run --cwd packages/ui compile
          bun run --cwd apps/extension build:firefox
          test -f apps/extension/.output/firefox-mv3/manifest.json
          submitted_root="$RUNNER_TEMP/bsync-submitted-firefox"
          rm -rf "$submitted_root"
          mkdir -p "$submitted_root"
          unzip -q "${{ steps.artifacts.outputs.firefox_zip }}" -d "$submitted_root"
          diff -qr "$submitted_root" apps/extension/.output/firefox-mv3
          popd

      - name: Save Firefox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bsync-${{ steps.version.outputs.version }}-firefox
          path: |
            ${{ steps.artifacts.outputs.firefox_zip }}
            ${{ steps.artifacts.outputs.sources_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Lint Firefox extension
        working-directory: apps/extension
        run: bun run lint:firefox

      - name: Validate and publish to Firefox Add-ons
        shell: bash
        run: |
          args=(
            --firefox-zip "${{ steps.artifacts.outputs.firefox_zip }}"
            --sources-zip "${{ steps.artifacts.outputs.sources_zip }}"
            --channel "$FIREFOX_CHANNEL"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          bun run publish:firefox -- "${args[@]}"
