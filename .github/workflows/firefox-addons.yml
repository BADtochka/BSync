name: Publish Firefox Add-on

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        default: none
        type: choice
        options:
          - patch
          - minor
          - major
          - none
      channel:
        description: Firefox Add-ons channel
        required: true
        default: listed
        type: choice
        options:
          - listed
          - unlisted
      dry_run:
        description: Validate AMO credentials without uploading
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: firefox-addons-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      WXT_FIREFOX_EXTENSION_ID: ${{ vars.WXT_FIREFOX_EXTENSION_ID || secrets.WXT_FIREFOX_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
      FIREFOX_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'listed' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Print release tool versions
        run: bun run tools:versions

      - name: Validate Firefox Add-ons config
        shell: bash
        run: |
          missing=0

          if [[ -z "${WXT_FIREFOX_EXTENSION_ID:-}" ]]; then
            echo "WXT_FIREFOX_EXTENSION_ID is required. Add it as a repository variable or secret." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_ISSUER:-}" ]]; then
            echo "FIREFOX_JWT_ISSUER is required. Add it as a repository secret." >&2
            missing=1
          fi

          if [[ -z "${FIREFOX_JWT_SECRET:-}" ]]; then
            echo "FIREFOX_JWT_SECRET is required. Add it as a repository secret." >&2
            missing=1
          fi

          exit "$missing"

      - name: Resolve extension version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="$(bun run version:extension -- "${{ inputs.bump }}")"
            bun install --lockfile-only
          else
            version="$(bun -e "console.log((await Bun.file('apps/extension/package.json').json()).version)")"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check release tag
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists." >&2
            exit 1
          fi

      - name: Compile
        run: bun run compile

      - name: Build Firefox extension zip
        working-directory: apps/extension
        run: bun run zip:firefox

      - name: Validate Firefox artifacts
        id: artifacts
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
        run: bun run validate:artifact -- firefox

      - name: Save Firefox artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bsync-${{ steps.version.outputs.version }}-firefox
          path: |
            ${{ steps.artifacts.outputs.firefox_zip }}
            ${{ steps.artifacts.outputs.sources_zip }}
          if-no-files-found: error
          retention-days: 30

      - name: Lint Firefox extension
        working-directory: apps/extension
        run: bun run lint:firefox

      - name: Validate and publish to Firefox Add-ons
        shell: bash
        run: |
          args=(
            --firefox-zip "${{ steps.artifacts.outputs.firefox_zip }}"
            --sources-zip "${{ steps.artifacts.outputs.sources_zip }}"
            --channel "$FIREFOX_CHANNEL"
          )

          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi

          bun run publish:firefox -- "${args[@]}"

      - name: Commit version bump
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && inputs.bump != 'none' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/extension/package.json bun.lock
          git commit -m "chore(extension): release ${{ steps.version.outputs.tag }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} "${{ steps.version.outputs.tag }}"
