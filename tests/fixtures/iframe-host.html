<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BSync iframe media fixture</title>
    <style>
      body { margin: 0; padding: 24px; color: #f1f6fa; background: #07090d; font: 16px sans-serif; }
      iframe { width: min(960px, 100%); height: 560px; border: 1px solid #65f3ff; }
      code { color: #65f3ff; }
    </style>
  </head>
  <body>
    <h1>Top frame without media</h1>
    <p>The only media element is inside the iframe. Add <code>?delay=3000</code> to delay it.</p>
    <iframe id="player" title="Cross-origin media fixture"></iframe>
    <script>
      const query = new URLSearchParams(location.search);
      const playerOrigin = query.get('playerOrigin') || 'http://127.0.0.1:4174';
      const delay = query.get('delay') || '0';
      document.querySelector('#player').src = `${playerOrigin}/iframe-player.html?delay=${encodeURIComponent(delay)}`;
    </script>
  </body>
</html>
